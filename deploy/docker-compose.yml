services:
  portal:
    build:
      context: ..
      dockerfile: Dockerfile
    image: portal-gestiondocumental:latest
    user: '${NAS_UID_GID:?Completar NAS_UID_GID}'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    mem_limit: 384m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - /root/gestiondocumental-secrets/portal.env
    environment:
      API_HOST: '${API_HOST:-api-gestiondocumental.sistemasfsv.com}'
    expose: ['8080']
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/portal-health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  cloudflared:
    image: cloudflare/cloudflared:latest
    user: '${NAS_UID_GID:?Completar NAS_UID_GID}'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    command: --config /etc/cloudflared/config.yml tunnel run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on: [portal]
