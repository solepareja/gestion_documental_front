<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fa8954" />
    <title>Sin conexión · Gestor Documental</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #1e293b;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 400px;
        padding: 32px;
        text-align: center;
      }
      button {
        background: #fa8954;
        color: #27150c;
        border: 0;
        border-radius: 12px;
        padding: 14px 24px;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No hay conexión</h1>
      <p>
        Necesitas conexión con el servidor para consultar documentos y guardar cambios. Comprueba tu
        conexión y vuelve a intentarlo.
      </p>
      <button onclick="location.reload()">Volver a intentar</button>
    </main>
  </body>
</html>
